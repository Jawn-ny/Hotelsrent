<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>ShouSi's House 记账板</title>

  <link
    rel="stylesheet"
    href="/frontend/styles.css"
  />
</head>


<body>

  <div class="page-shell">

    <header class="hero-card">

      <div class="hero-left">

        <p class="eyebrow">
          Rent Life Expense Tracker
        </p>

        <h1>
          ShouSi's House 记账板
        </h1>

        <p class="hero-desc">
          暖暖记录每一笔支出，把租房生活整理得清清楚楚。
        </p>

        <div class="hero-tags">

          <span class="tag warm">
            卡通风
          </span>

          <span class="tag cool">
            布偶猫蓝白
          </span>

          <span class="tag handdrawn">
            SQLite
          </span>

        </div>

      </div>


      <div class="hero-right">

        <div class="cat-card">

          <div class="cat-face">

            <div class="ear left-ear"></div>
            <div class="ear right-ear"></div>

            <div class="eye left-eye"></div>
            <div class="eye right-eye"></div>

            <div class="nose"></div>
            <div class="mouth"></div>

          </div>

          <p class="cat-note">
            布偶猫记账小助手
          </p>

        </div>

      </div>

    </header>


    <section class="status-row">

      <div class="status-card">

        <h2>
          后端状态
        </h2>

        <p
          id="health-status"
          class="status-pill pending"
        >
          检测中...
        </p>

      </div>


      <div class="status-card">

        <h2>
          快捷操作
        </h2>

        <div class="button-group">

          <button
            id="refresh-expenses-btn"
            class="sketch-btn"
          >
            刷新支出列表
          </button>

          <button
            id="refresh-summary-btn"
            class="sketch-btn cool-btn"
          >
            刷新统计
          </button>

        </div>

      </div>

    </section>


    <section class="content-grid">

      <div class="panel">

        <div class="section-head">

          <h2 id="form-title">
            添加支出
          </h2>

          <span
            id="edit-status"
            class="edit-badge hidden"
          >
            编辑模式
          </span>

        </div>


        <form
          id="expense-form"
          class="expense-form"
        >

          <div class="form-grid">

            <label>
              日期

              <input
                type="date"
                id="date"
                required
              />
            </label>


            <label>
              物品

              <input
                type="text"
                id="item"
                placeholder="例如：电饭煲"
                required
              />
            </label>


            <label>
              金额

              <input
                type="number"
                id="amount"
                step="0.01"
                min="0.01"
                placeholder="例如：199"
                required
              />
            </label>


            <label>
              分类

              <input
                type="text"
                id="category"
                placeholder="例如：家电"
                required
              />
            </label>


            <label>
              付款人

              <input
                type="text"
                id="payer"
                placeholder="例如：A"
                required
              />
            </label>


            <label class="full-width">
              备注

              <input
                type="text"
                id="note"
                placeholder="例如：租房购买"
              />
            </label>

          </div>


          <div class="button-group">

            <button
              id="submit-expense-btn"
              type="submit"
              class="sketch-btn"
            >
              添加支出
            </button>


            <button
              id="cancel-edit-btn"
              type="button"
              class="sketch-btn cool-btn hidden"
            >
              取消编辑
            </button>


            <button
              type="reset"
              class="sketch-btn light-btn"
            >
              清空表单
            </button>

          </div>

        </form>


        <p
          id="form-message"
          class="message"
        ></p>

      </div>


      <div class="panel">

        <h2>
          按月份统计
        </h2>

        <div class="month-summary-box">

          <label>
            选择月份

            <input
              type="month"
              id="summary-month"
            />
          </label>


          <button
            id="month-summary-btn"
            class="sketch-btn"
          >
            查询月份统计
          </button>

        </div>


        <div
          id="month-summary-result"
          class="result-card empty-state"
        >
          这里会显示月份统计结果
        </div>

      </div>

    </section>


    <section class="panel">

      <div class="section-head">

        <h2>
          支出记录
        </h2>

        <span
          id="expense-count"
          class="count-badge"
        >
          0 条记录
        </span>

      </div>


      <div class="query-panel">

        <div class="search-row">

          <label class="query-field">

            <span>
              关键词搜索
            </span>

            <input
              type="text"
              id="expense-search-input"
              placeholder="搜索物品、分类、付款人或备注"
            />

          </label>


          <button
            id="search-expenses-btn"
            class="sketch-btn"
          >
            搜索
          </button>


          <button
            id="clear-search-btn"
            class="sketch-btn light-btn"
          >
            清除搜索
          </button>

        </div>


        <div class="filter-row">

          <label class="query-field">

            <span>
              分类筛选
            </span>

            <select id="category-filter">

              <option value="">
                全部分类
              </option>

            </select>

          </label>


          <label class="query-field">

            <span>
              付款人筛选
            </span>

            <select id="payer-filter">

              <option value="">
                全部付款人
              </option>

            </select>

          </label>


          <button
            id="apply-filter-btn"
            class="sketch-btn cool-btn"
          >
            应用筛选
          </button>


          <button
            id="clear-filter-btn"
            class="sketch-btn light-btn"
          >
            清除筛选
          </button>

        </div>


        <div class="sort-row">

          <label class="query-field">

            <span>
              排序字段
            </span>

            <select id="sort-by">

              <option value="date">
                日期
              </option>

              <option value="amount">
                金额
              </option>

              <option value="item">
                物品
              </option>

            </select>

          </label>


          <label class="query-field">

            <span>
              排序方向
            </span>

            <select id="sort-order">

              <option value="desc">
                降序
              </option>

              <option value="asc">
                升序
              </option>

            </select>

          </label>


          <button
            id="apply-sort-btn"
            class="sketch-btn cool-btn"
          >
            应用排序
          </button>


          <button
            id="clear-sort-btn"
            class="sketch-btn light-btn"
          >
            恢复默认排序
          </button>

        </div>

      </div>


      <div class="table-wrap">

        <table>

          <thead>

            <tr>
              <th>ID</th>
              <th>日期</th>
              <th>物品</th>
              <th>金额</th>
              <th>分类</th>
              <th>付款人</th>
              <th>备注</th>
              <th>操作</th>
            </tr>

          </thead>


          <tbody id="expense-table-body">

            <tr>

              <td
                colspan="8"
                class="empty-cell"
              >
                暂无支出记录
              </td>

            </tr>

          </tbody>

        </table>

      </div>


      <div class="pagination-row">

        <label class="page-size-group">

          <span>
            每页显示
          </span>

          <select id="page-size">

            <option value="5">
              5 条
            </option>

            <option
              value="10"
              selected
            >
              10 条
            </option>

            <option value="20">
              20 条
            </option>

            <option value="50">
              50 条
            </option>

          </select>

        </label>


        <div
          id="pagination-info"
          class="pagination-info"
        >
          第 1 / 1 页
        </div>


        <div class="pagination-actions">

          <button
            id="previous-page-btn"
            class="sketch-btn light-btn"
          >
            上一页
          </button>


          <button
            id="next-page-btn"
            class="sketch-btn"
          >
            下一页
          </button>

        </div>

      </div>

    </section>


    <section class="summary-grid">

      <div class="panel">

        <h2>
          按分类统计
        </h2>

        <div
          id="category-summary"
          class="summary-list empty-state"
        >
          暂无分类统计数据
        </div>

      </div>


      <div class="panel">

        <h2>
          按付款人统计
        </h2>

        <div
          id="payer-summary"
          class="summary-list empty-state"
        >
          暂无付款人统计数据
        </div>

      </div>

    </section>

  </div>


  <script src="/frontend/api.js"></script>
  <script src="/frontend/app.js"></script>

</body>

</html>
